name: Publish

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  npm:
    name: npm provenance publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: release
        name: Resolve tagged release commit
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse "$GITHUB_REF^{}")" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - id: validation
        name: Find fresh successful exact-commit validation
        uses: actions/github-script@v7
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        with:
          script: |
            const commit = process.env.RELEASE_COMMIT;
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: commit,
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              const created = Date.parse(run.created_at);
              if (
                run.head_sha !== commit ||
                !run.path?.includes('.github/workflows/correctness.yml@') ||
                run.conclusion !== 'success' ||
                !Number.isFinite(created) ||
                created < cutoff
              )
                continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const aggregate = jobs.find(
                (job) =>
                  job.name === 'sikka-1.0-validation' &&
                  job.status === 'completed' &&
                  job.conclusion === 'success'
              );
              if (!aggregate) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const hasArtifact = (name) =>
                artifacts.filter((artifact) => artifact.name === name && artifact.expired === false).length === 1;
              if (!hasArtifact('sikka-1.0-validation') || !hasArtifact('sikka-candidate')) continue;
              core.setOutput('run-id', run.id);
              core.setOutput('created-at', run.created_at);
              return;
            }
            throw new Error(`No fresh successful sikka-1.0-validation run for ${commit}`);
      - id: node-line
        name: Read project Node.js line
        shell: bash
        run: |
          node_line="$(awk -F '"' '/^node = / { print $2; exit }' mise.toml)"
          test -n "$node_line"
          echo "version=$node_line" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-line.outputs.version }}
      - name: Download exact validation evidence
        uses: actions/download-artifact@v4
        with:
          name: sikka-1.0-validation
          path: .ci/evidence
          run-id: ${{ steps.validation.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: sikka-candidate
          path: .ci/candidate
          run-id: ${{ steps.validation.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify evidence, candidate, release notes, and tag
        shell: bash
        run: |
          set -euo pipefail
          tarball=(.ci/candidate/*.tgz)
          test "${#tarball[@]}" -eq 1
          node scripts/verify-release-evidence.mjs \
            .ci/evidence "${tarball[0]}" \
            "${{ steps.release.outputs.commit }}" \
            "${{ steps.validation.outputs.run-id }}" \
            "${{ steps.validation.outputs.created-at }}" \
            "${{ steps.release.outputs.tag }}" CHANGELOG.md
      - name: Publish exact validated candidate with provenance
        shell: bash
        run: |
          set -euo pipefail
          tarball=(.ci/candidate/*.tgz)
          test "${#tarball[@]}" -eq 1
          npm publish "${tarball[0]}" --provenance
